<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Architecture: input flows into simulation state, which drives the WebGL renderer, the audio synth and the Canvas burst layer">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9z" fill="#6f838f"/></marker>
  </defs>
  <path id="p0" d="M 232 165 L 292 165" fill="none" stroke="#6f838f" stroke-opacity=".7" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#ah)"/>
  <path id="p1" d="M 502 165 C 540 165 530 62 568 62" fill="none" stroke="#6f838f" stroke-opacity=".7" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#ah)"/>
  <path id="p2" d="M 502 165 L 568 165" fill="none" stroke="#6f838f" stroke-opacity=".7" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#ah)"/>
  <path id="p3" d="M 502 165 C 540 165 530 268 568 268" fill="none" stroke="#6f838f" stroke-opacity=".7" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#ah)"/>
  
  <g>
    <rect x="24" y="110" width="208" height="110" rx="14" fill="#0f171c" stroke="#2a3943" stroke-width="1.2"/>
    <text x="44" y="140" font-family="'Avenir Next','Helvetica Neue','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#e8f0f4">Input</text>
    <text x="44" y="160" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#ffd96a">js/app/main.js</text>
    <text x="44" y="182" font-family="'Avenir Next','Helvetica Neue','Segoe UI',sans-serif" font-size="12.5" fill="#6f838f">Pointer, touch and keyboard.<tspan x="44" dy="17">Holds a bubble, then pops it.</tspan></text>
  </g>
  
  <g>
    <rect x="294" y="100" width="208" height="130" rx="14" fill="#0f171c" stroke="#ffd96a" stroke-width="1.6"/>
    <text x="314" y="130" font-family="'Avenir Next','Helvetica Neue','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#e8f0f4">Simulation state</text>
    <text x="314" y="150" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#ffd96a">js/core/</text>
    <text x="314" y="172" font-family="'Avenir Next','Helvetica Neue','Segoe UI',sans-serif" font-size="12.5" fill="#6f838f">Per-bubble state, shared sheet,<tspan x="314" dy="17">layout and membrane shape.</tspan><tspan x="314" dy="17">No DOM, no GL: pure logic.</tspan></text>
  </g>
  
  <g>
    <rect x="570" y="12" width="246" height="100" rx="14" fill="#0f171c" stroke="#2a3943" stroke-width="1.2"/>
    <text x="590" y="42" font-family="'Avenir Next','Helvetica Neue','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#e8f0f4">WebGL film</text>
    <text x="590" y="62" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#ffd96a">js/rendering/</text>
    <text x="590" y="84" font-family="'Avenir Next','Helvetica Neue','Segoe UI',sans-serif" font-size="12.5" fill="#6f838f">Glossy sheet drawn by GLSL shaders.<tspan x="590" dy="17">Highlights follow tilt or mouse.</tspan></text>
  </g>
  
  <g>
    <rect x="570" y="124" width="246" height="82" rx="14" fill="#0f171c" stroke="#2a3943" stroke-width="1.2"/>
    <text x="590" y="154" font-family="'Avenir Next','Helvetica Neue','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#e8f0f4">Pop sound</text>
    <text x="590" y="174" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#ffd96a">js/audio/sound.js</text>
    <text x="590" y="196" font-family="'Avenir Next','Helvetica Neue','Segoe UI',sans-serif" font-size="12.5" fill="#6f838f">Synthesised in Web Audio.</text>
  </g>
  
  <g>
    <rect x="570" y="218" width="246" height="94" rx="14" fill="#0f171c" stroke="#2a3943" stroke-width="1.2"/>
    <text x="590" y="248" font-family="'Avenir Next','Helvetica Neue','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#e8f0f4">Comic burst</text>
    <text x="590" y="268" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#ffd96a">js/audio/effects.js</text>
    <text x="590" y="290" font-family="'Avenir Next','Helvetica Neue','Segoe UI',sans-serif" font-size="12.5" fill="#6f838f">Canvas 2D strokes around the pop.</text>
  </g>
  <circle r="4.2" fill="#ffd96a"><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite" calcMode="linear"><mpath href="#p0"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.6s" begin="0.00s" repeatCount="indefinite"/></circle>
  <circle r="4.2" fill="#ffd96a"><animateMotion dur="2.8s" begin="0.35s" repeatCount="indefinite" calcMode="linear"><mpath href="#p1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.8s" begin="0.35s" repeatCount="indefinite"/></circle>
  <circle r="4.2" fill="#ffd96a"><animateMotion dur="2.8s" begin="0.70s" repeatCount="indefinite" calcMode="linear"><mpath href="#p2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.8s" begin="0.70s" repeatCount="indefinite"/></circle>
  <circle r="4.2" fill="#ffd96a"><animateMotion dur="2.8s" begin="1.05s" repeatCount="indefinite" calcMode="linear"><mpath href="#p3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.8s" begin="1.05s" repeatCount="indefinite"/></circle>
</svg>
