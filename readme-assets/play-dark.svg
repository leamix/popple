  <circle cx="39" cy="31" r="17" fill="none" stroke="#ffd96a" stroke-width="1.5"><animate attributeName="r" values="17;27" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="2.4s" repeatCount="indefinite"/></circle>
