    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fff2b8"/><stop offset=".55" stop-color="#ffd96a"/><stop offset="1" stop-color="#d9a21c"/></radialGradient>
    <clipPath id="clip"><rect x="3" y="3" width="262" height="58" rx="29"/></clipPath>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="190%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/></filter>
